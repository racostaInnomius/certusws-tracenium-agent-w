name: test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Pinned by the repo's .nodeversion file (same source the release workflow uses).
          node-version-file: .nodeversion
          cache: npm

      # npm ci compiles native modules (better-sqlite3, node-pty) via node-gyp.
      # ubuntu-latest ships python3 + a C/C++ toolchain, so no extra setup is needed.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # ── Que los .csproj de Windows compilen, DESDE UBUNTU ──────────────
      #
      # Esto existe por una rotura concreta: el Release del 06-sep se cayó
      # con siete CS0246 en los DOS binarios de Windows (run 34067964253)
      # porque `DxgiInteropTypes.cs` —los structs de DXGI, sacados a su
      # propio fichero en fecf7fd— se añadió al .csproj de pruebas y no a
      # los otros dos.
      #
      # El patrón que lo permite: `Tracenium.PrivSvc.Windows` coge el árbol
      # entero, mientras que `Tracenium.ScreenCap` y la sonda de ADR-0006
      # ENUMERAN los ficheros a mano —a propósito, para incluir el código
      # de captura por referencia en vez de forkearlo—. El que globa nunca
      # avisa de que la lista de los otros se quedó corta, así que la
      # rotura no aparece hasta el Release, o sea después del merge.
      #
      # Corre en ubuntu sin nada de Windows: `EnableWindowsTargeting` ya
      # está puesto en los .csproj y el compilador no necesita el SO
      # destino. Medido sobre `mcr.microsoft.com/dotnet/sdk:8.0` con el
      # árbol y el caché de NuGet vacíos —lo que ve un runner—: 15-20 s
      # los cuatro, restore incluido. Por eso no lleva caché de paquetes:
      # montarla no lo bajó (16 s vs 20 s), y sería una pieza más que
      # mantener.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # La misma que usa el Release. Si divergen, el CI diría verde
          # sobre un compilador que no es el que construye el MSI.
          dotnet-version: '8.0.x'

      - name: Build .NET projects (los que enumeran ficheros a mano)
        run: |
          # Sin `set -e` a propósito: se construyen los CUATRO y se falla al
          # final. Pararse en el primero escondería que la misma lista corta
          # rompió también a los demás — que es justo lo que pasó: cayeron
          # ScreenCap y la sonda a la vez.
          # `Tracenium.PrivSvc.Tests` no está en la lista: lo construye el
          # paso siguiente al correrlo. Meterlo aquí sería compilarlo dos
          # veces y, peor, dejar dos sitios que actualizar.
          rotos=""
          for p in \
            privsvc/windows/Tracenium.PrivSvc.Windows/Tracenium.PrivSvc.Windows.csproj \
            privsvc/windows/Tracenium.ScreenCap/Tracenium.ScreenCap.csproj \
            experiments/win-session-probe/win-session-probe.csproj
          do
            echo "── $p"
            dotnet build "$p" --nologo -v minimal || rotos="$rotos $p"
          done
          if [ -n "$rotos" ]; then
            for p in $rotos; do echo "::error::no compila: $p"; done
            exit 1
          fi

      # ── Las 127 pruebas de C#, que hasta hoy no corrían en ningún sitio ──
      #
      # Existían desde hace meses y sólo las veía quien las lanzaba a mano:
      # ni el job de test ni el Release las tocaban. Una suite que no corre
      # sola es documentación, no una red.
      #
      # Corre en ubuntu porque está escrita para eso: el .csproj de pruebas
      # tiene TFM `net8.0` a secas —sin `-windows`— e incluye a mano sólo
      # las partes que no llaman a Win32. Lo que sí lo llama (DPAPI, el
      # registro, la captura) se queda fuera a propósito. Un `[DllImport]`
      # sólo falla al INVOCARLO, y estas pruebas no invocan: miden formas y
      # parsean texto.
      #
      # Comprobado antes de añadirlo, dentro de `dotnet/sdk:8.0`: 127/127 en
      # 323 ms, y muerde — un campo de más en `DXGI_OUTDUPL_FRAME_INFO`
      # pone 2 en rojo (el tamaño en memoria y la posición del puntero),
      # que es justo el fallo que en Windows no da excepción sino un
      # proceso caído más tarde y en otro sitio.
      - name: Test .NET (PrivSvc)
        run: dotnet test privsvc/windows/Tracenium.PrivSvc.Tests/Tracenium.PrivSvc.Tests.csproj --nologo -v minimal

      # La cobertura de exec del perfil la comprueba un test de vitest
      # (test/packaging/apparmor-exec-coverage.test.ts), que corre en el paso
      # anterior y es multiplataforma. Lo que ese test NO puede hacer es
      # decidir si el perfil es SINTÁCTICAMENTE válido: eso sólo lo sabe
      # apparmor_parser, que es Linux-only — y por eso vive aquí.
      #
      # Importa porque el perfil lo instala nuestro propio .deb: un error de
      # sintaxis no falla en el build, falla en el postinst del endpoint, y
      # deja al host sin perfil o sin paquete.
      #
      # -Q parsea sin cargar en el kernel, así que no hace falta que el runner
      # tenga AppArmor activo ni que el perfil aplique a nada de aquí.
      - name: Validate AppArmor profile syntax
        run: |
          if ! command -v apparmor_parser >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq apparmor
          fi
          sudo apparmor_parser -Q -K packaging/linux/apparmor/usr.lib.tracenium.privsvc
