name: test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Pinned by the repo's .nodeversion file (same source the release workflow uses).
          node-version-file: .nodeversion
          cache: npm

      # npm ci compiles native modules (better-sqlite3, node-pty) via node-gyp.
      # ubuntu-latest ships python3 + a C/C++ toolchain, so no extra setup is needed.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
