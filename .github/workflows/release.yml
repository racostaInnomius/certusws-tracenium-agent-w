# .github/workflows/release.yml
#
# Build all five Tracenium Agent installers on push to `main` and
# publish them to Azure Blob Storage. The branch hygiene gate is at
# the merge boundary: developers work on `Package-Prepare`, and a
# manual PR / merge to `main` is what triggers a release.
#
# ────────────────────────────────────────────────────────────────────
# Required GitHub Secrets (Repo Settings → Secrets and variables → Actions)
# ────────────────────────────────────────────────────────────────────
#
# Azure (service-principal auth via client secret):
#   AZURE_TENANT_ID                  (uuid; non-secret, public)
#   AZURE_CLIENT_ID                  (uuid of the App Registration that has
#                                     both Trusted Signing signer perms AND
#                                     "Storage Blob Data Contributor" on the
#                                     cwsinveid storage account)
#   AZURE_CLIENT_SECRET              (the rotated client secret from the
#                                     App Registration's "Certificates &
#                                     secrets" tab)
#   AZURE_SUBSCRIPTION_ID            (uuid of the subscription that owns
#                                     the cwsinveid storage account.
#                                     Required because we pass
#                                     `--allow-no-subscriptions` to
#                                     `az login` — the SP has only data
#                                     plane roles (no subscription-level
#                                     Reader), so subscription
#                                     auto-discovery doesn't surface
#                                     anything and `az login` fails with
#                                     "No subscriptions found for ***".
#                                     Get it with:
#                                       az account list --query "[].id" -o tsv
#                                     or copy from Azure Portal →
#                                     Subscriptions blade.)
#
# macOS code signing + notarization:
#   MACOS_CERT_P12_BASE64            (base64 of "Developer ID Application"
#                                     .p12 export — signs Mach-O binaries
#                                     INSIDE the pkg: node, .node files,
#                                     Status.app)
#   MACOS_CERT_PASSWORD              (password used at App-cert .p12 export)
#   MACOS_INSTALLER_P12_BASE64       (base64 of "Developer ID Installer"
#                                     .p12 export — signs the OUTER pkg;
#                                     this is a DIFFERENT cert from the
#                                     App one, generated separately on
#                                     developer.apple.com)
#   MACOS_INSTALLER_PASSWORD         (password used at Installer-cert .p12)
#   MACOS_KEYCHAIN_PASSWORD          (any random string; protects the
#                                     ephemeral keychain we create in CI)
#   ASC_KEY_P8_BASE64                (base64 of AuthKey_XXXXXX.p8 from
#                                     App Store Connect)
#   ASC_KEY_ID                       (10-char Key ID — printed in the
#                                     keys list at appstoreconnect.apple.com)
#   ASC_ISSUER_ID                    (UUID of the Apple Developer team —
#                                     printed at top of the keys page)
#
# ────────────────────────────────────────────────────────────────────
# One-time Azure RBAC setup
# ────────────────────────────────────────────────────────────────────
#
# Roles on the App Registration's service principal:
#   - "Trusted Signing Certificate Profile Signer" on CertusWS-Signing
#     account → safecertus-cp-public profile
#   - "Storage Blob Data Contributor" on the cwsinveid storage account
#     (or just on the `tracenium` container, scoped down)
#
# Subscription resolution: AZURE_SUBSCRIPTION_ID is passed explicitly
# and applied via `az account set` after `az login --allow-no-
# subscriptions`. This is the safe-by-default setup because the SP only
# holds the two data-plane / signing roles above — no subscription-level
# Reader — so `az login` without `--allow-no-subscriptions` fails with
# "No subscriptions found for ***" even when the SP has perfectly valid
# access to the storage account. Adding subscription-level Reader to the
# SP would also fix the symptom but broadens its blast radius
# unnecessarily; passing the subscription explicitly keeps the SP scoped
# tight.
# ────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    # Both branches trigger the 4 BUILD jobs. The `publish` job is
    # gated below to run ONLY on `main` — that's the two-stage validation
    # model:
    #
    #   1. push to Package-Prepare → builds + signs all 5 artifacts,
    #      uploads as GitHub Actions artifacts (downloadable from the run
    #      summary). NO blob upload. Operators install locally to verify.
    #
    #   2. merge Package-Prepare → main → same 4 builds, AND `publish`
    #      job runs. Blobs replaced in Azure storage, agent metadata
    #      endpoint reflects the new version.
    #
    # If you ever decide Package-Prepare is too noisy, drop it here.
    branches: [main, Package-Prepare]
  workflow_dispatch:
    inputs:
      strict_notarize:
        description: "Fail if macOS notarization fails (default: false — ship signed-only pkg as fallback)"
        type: boolean
        default: false
      force_rebuild:
        description: "On main: ignore Package-Prepare artifact promotion and rebuild from scratch"
        type: boolean
        default: false
      promote_run_id:
        description: "On main: promote artifacts from this specific Package-Prepare run ID (overrides auto-detection)"
        required: false
        type: string

# Service-principal auth uses a client secret (not OIDC), so we don't
# need id-token: write. The other reads:
#   - contents:  checkout, read package.json/.nodeversion
#   - actions:   cross-run download-artifact (the `publish` job on main
#                pulls artifacts from a previous Package-Prepare run
#                instead of rebuilding — see `resolve` job)
permissions:
  contents: read
  actions: read

# Opt all JavaScript-based actions (checkout, setup-node, upload-artifact,
# download-artifact, cache, azure/login, etc.) onto Node 24 ahead of the
# 2026-06-02 forced migration. Node 20 is deprecated since 2025-09-19 and
# will be removed from runners on 2026-09-16; running on the supported
# major now avoids a re-test scramble in two weeks.
#
# This env var ONLY affects the runtime that hosts the actions
# themselves — it has no relationship to our `.nodeversion` (the Node
# version we ship inside the agent payload), nor to the host Node that
# `actions/setup-node@v4` installs for `npm ci`.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Don't run two release builds in parallel for the same ref. The
# publish step's blob upload is `--overwrite`, so a race would produce
# garbled metadata on the latest blob. We let in-flight runs FINISH
# (no cancel-in-progress) to avoid leaving partial uploads behind.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────
  # resolve — figure out version, node version, AND build_mode.
  #
  # build_mode controls whether the 4 build jobs run fresh or are
  # skipped in favor of promoting artifacts from a prior Package-Prepare
  # run. Two values:
  #
  #   "full"    — run all 4 build jobs. The publish job downloads
  #               artifacts from THIS run.
  #
  #   "promote" — skip the 4 build jobs. The publish job downloads
  #               artifacts from the Package-Prepare run identified by
  #               `source_run_id` and uploads them to blob unchanged.
  #               No build minutes burned on main.
  #
  # When does promote happen?
  #   - On Package-Prepare push:  always "full" (we need to BUILD)
  #   - On main push:
  #       - If `force_rebuild` input set:    "full"  (manual override)
  #       - If `promote_run_id` input set:   "promote" with that run
  #       - Else: look up the most recent successful release.yml run
  #               on Package-Prepare with the SAME head SHA as current
  #               main HEAD. Found → "promote" with that run. Not
  #               found → "full" (e.g. merge-commit / squash-merge to
  #               main produces a new SHA; fast-forward preserves it).
  #
  # Operator tip: if you want the promote path on every release, adopt
  # fast-forward merging:
  #   git checkout main && git merge --ff-only Package-Prepare && git push
  # Merge-commits and squash-merges will rebuild (safer default — no
  # silent shipping of un-rebuilt code).
  # ──────────────────────────────────────────────────────────────────
  resolve:
    name: Resolve release context
    runs-on: ubuntu-latest
    outputs:
      version:       ${{ steps.r.outputs.version }}
      node_version:  ${{ steps.r.outputs.node_version }}
      build_mode:    ${{ steps.r.outputs.build_mode }}
      source_run_id: ${{ steps.r.outputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4

      - id: r
        name: Resolve version + node version + build mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          # ── Version + node version (same as before) ──
          version=$(jq -r .version package.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "ERROR: package.json missing 'version' field" >&2
            exit 1
          fi
          node_version=$(tr -d '[:space:]' < .nodeversion)
          if [ -z "$node_version" ]; then
            echo "ERROR: .nodeversion missing or empty" >&2
            exit 1
          fi
          echo "version=$version"            | tee -a "$GITHUB_OUTPUT"
          echo "node_version=$node_version"  | tee -a "$GITHUB_OUTPUT"

          # ── Build mode resolution ──
          build_mode="full"
          source_run_id=""

          # Package-Prepare always builds.
          if [ "${{ github.ref }}" = "refs/heads/Package-Prepare" ]; then
            echo "Branch is Package-Prepare — build_mode=full"
          # Manual override: force_rebuild from workflow_dispatch.
          elif [ "${{ inputs.force_rebuild }}" = "true" ]; then
            echo "force_rebuild=true input set — build_mode=full"
          # Manual override: promote from a specific run.
          elif [ -n "${{ inputs.promote_run_id }}" ]; then
            echo "promote_run_id input set: ${{ inputs.promote_run_id }} — build_mode=promote"
            build_mode="promote"
            source_run_id="${{ inputs.promote_run_id }}"
          # Auto-detect: any successful Package-Prepare run on the same SHA?
          else
            SHA="${{ github.sha }}"
            echo "Looking up Package-Prepare runs for SHA $SHA ..."
            # API returns runs sorted by created_at desc; take the first match.
            run_id=$(gh api \
              "/repos/${{ github.repository }}/actions/workflows/release.yml/runs?branch=Package-Prepare&status=success&per_page=20" \
              --jq "[.workflow_runs[] | select(.head_sha == \"$SHA\")] | .[0].id // empty")

            if [ -n "$run_id" ]; then
              echo "Found Package-Prepare build for $SHA: run $run_id — build_mode=promote"
              build_mode="promote"
              source_run_id="$run_id"
            else
              echo "No Package-Prepare build for $SHA — build_mode=full"
              echo "(typical for merge-commits or squash-merges; fast-forward merges preserve SHA)"
            fi
          fi

          echo "build_mode=$build_mode"           | tee -a "$GITHUB_OUTPUT"
          echo "source_run_id=$source_run_id"     | tee -a "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────
  # linux — produces Tracenium-Agent-<v>-x64.{deb,rpm}
  # ──────────────────────────────────────────────────────────────────
  linux:
    name: Build · Linux x64 (.deb + .rpm)
    needs: resolve
    if: needs.resolve.outputs.build_mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.resolve.outputs.node_version }}
          cache: npm

      # nfpm packager isn't in apt; install from the GitHub release.
      # Pinning to a known-good version — bump deliberately.
      - name: Install nfpm
        run: |
          NFPM_VERSION=2.39.0
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb" -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
          nfpm --version

      - name: Install repo dependencies (host)
        run: npm ci

      # Cache the bundled node tarball + the staging node_modules across
      # runs. Both are content-addressed by lockfile + .nodeversion, so
      # the cache key invalidates automatically when either changes.
      - name: Restore Linux build cache
        uses: actions/cache@v4
        with:
          path: |
            build/.node-cache
            build/linux/.node-cache
            build/linux/staging/node_modules
          # Hash BOTH package-lock.json AND package.json so a version
          # bump invalidates the cache. We hit a bug on 1.1.17 where
          # the staging dir held an old package.json (matching node_modules
          # from a prior build with a non-bumped lock), esbuild inlined
          # that stale `pkg.version` into the bundle, and the agent
          # reported the wrong version despite the .deb being labeled
          # correctly. See scripts/build-linux-binaries.sh for the
          # in-script defense; this cache key is the second layer.
          key: linux-build-${{ needs.resolve.outputs.node_version }}-${{ hashFiles('package-lock.json', 'package.json') }}

      - name: Build .deb + .rpm
        run: npm run pkg:linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            build/linux/pkg-out/Tracenium-Agent-${{ needs.resolve.outputs.version }}-x64.deb
            build/linux/pkg-out/Tracenium-Agent-${{ needs.resolve.outputs.version }}-x64.rpm
          retention-days: 14
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # macos — produces Tracenium-Agent-<v>-arm64.pkg
  # Runs on macos-14 (Apple Silicon, Xcode pre-installed)
  # ──────────────────────────────────────────────────────────────────
  macos:
    name: Build · macOS arm64 (.pkg)
    needs: resolve
    if: needs.resolve.outputs.build_mode == 'full'
    runs-on: macos-14
    # 45-min cap. The build itself takes ~5 min; notarization is the
    # tail — Apple's notary queue is normally 1-5 min but can spike
    # to 20-30 min on heavy days. 45 min covers a bad day without
    # letting a wedged submission burn the runner indefinitely.
    timeout-minutes: 45
    env:
      TRACENIUM_AGENT_ARCH: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.resolve.outputs.node_version }}
          cache: npm

      - name: Install repo dependencies (host)
        run: npm ci

      # ── Import code-signing identities into a temporary keychain ──
      # We DON'T touch the default login.keychain. Everything we add
      # goes into a per-run keychain that disappears with the runner.
      #
      # Two distinct identities live in this keychain:
      #   1. Developer ID Application — signs Mach-O binaries
      #      (node, *.node bindings, Status.app)
      #   2. Developer ID Installer   — signs the .pkg wrapper itself
      #      (REQUIRED for notarization — see build-macos-pkg.sh comment)
      - name: Import codesign identities
        env:
          MACOS_CERT_P12_BASE64:      ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD:        ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          MACOS_INSTALLER_PASSWORD:   ${{ secrets.MACOS_INSTALLER_PASSWORD }}
          KEYCHAIN_PASSWORD:          ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN_PATH="$RUNNER_TEMP/tracenium.keychain-db"

          # Fresh keychain each run.
          security create-keychain     -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600              "$KEYCHAIN_PATH"
          security unlock-keychain     -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 1. Application cert (codesign for Mach-O binaries inside pkg)
          APP_P12="$RUNNER_TEMP/app-cert.p12"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$APP_P12"
          security import "$APP_P12" \
            -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f "$APP_P12"

          # 2. Installer cert (productsign for the outer pkg)
          INST_P12="$RUNNER_TEMP/installer-cert.p12"
          echo "$MACOS_INSTALLER_P12_BASE64" | base64 --decode > "$INST_P12"
          security import "$INST_P12" \
            -P "$MACOS_INSTALLER_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f "$INST_P12"

          # Add the new keychain to the search list so `codesign` and
          # `productsign` find the identities.
          existing=$(security list-keychains -d user | tr -d '"')
          security list-keychain -d user -s $KEYCHAIN_PATH $existing

          # Allow apple tools + codesign + productsign to use the keys
          # without UI prompt (which would hang the runner).
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Sanity-print all identities now visible to apple tools.
          echo "=== signing identities ==="
          security find-identity -v "$KEYCHAIN_PATH"

      - name: Restore macOS build cache
        uses: actions/cache@v4
        with:
          path: |
            build/.node-cache
          key: macos-arm64-${{ needs.resolve.outputs.node_version }}

      - name: Build .pkg
        # The script auto-resolves the codesign identity from the
        # keychain (DEFAULT_CODESIGN_IDENTITY = "Developer ID Application:
        # CERTUS ITM LLC (3CN673MCWH)"). Override path stays open via
        # TRACENIUM_CODESIGN_IDENTITY env if the cert org changes.
        run: npm run pkg:macos

      # ── Notarize the .pkg so Gatekeeper accepts it without warning ──
      # On failure we ALWAYS fetch Apple's per-file verdict log so the
      # reason shows up in the Actions log (otherwise notarytool only
      # says "Invalid" with no context, which makes the failure
      # impossible to diagnose without a separate manual query).
      # Best-effort notarize. Apple's notary service has ~98% uptime
      # but occasional queue spikes hang submissions for 30+ min. We
      # don't want a transient Apple-side issue to block a release —
      # the pkg ALREADY has every Mach-O binary inside signed with
      # Developer ID + hardened runtime + timestamp + the outer pkg
      # productsigned with Developer ID Installer. That alone is enough
      # for:
      #   - MDM-pushed installs (Jamf, Intune, Kandji) — silent
      #   - Direct download installs — one-time "right-click → Open"
      #     bypass on the user's first install
      # Notarize only adds: removing the one-time bypass on direct
      # downloads. So shipping signed-only is a valid fallback.
      #
      # Override: workflow_dispatch with `strict_notarize: true` makes
      # the job FAIL if notarize doesn't succeed (use this for releases
      # you want bit-perfect Gatekeeper-trusted).
      - name: Notarize .pkg (best-effort)
        id: notarize
        continue-on-error: true
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID:        ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:     ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eu
          KEY_PATH="$RUNNER_TEMP/asc.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"

          PKG="build/pkg-out/Tracenium-Agent-${{ needs.resolve.outputs.version }}-arm64.pkg"
          if [ ! -f "$PKG" ]; then
            echo "ERROR: expected .pkg not produced: $PKG" >&2
            ls -la build/pkg-out/ >&2
            exit 1
          fi

          # --timeout caps wait at 10 min. Apple's queue is usually
          # 1-5 min for our pkg size; 10 min covers normal load + buffer.
          # Set tighter than typical advice (30 min) because every minute
          # waiting is 10x cost on macOS runners — and best-effort
          # fallback means a timeout just ships signed-only instead of
          # blocking the release. Operator can re-run later if they want
          # to retry notarization at a less saturated time.
          SUBMIT_JSON=$(xcrun notarytool submit "$PKG" \
            --key       "$KEY_PATH" \
            --key-id    "$ASC_KEY_ID" \
            --issuer    "$ASC_ISSUER_ID" \
            --output-format json \
            --timeout   600 \
            --wait)
          echo "$SUBMIT_JSON"

          SUBMISSION_ID=$(echo "$SUBMIT_JSON" | jq -r '.id')
          STATUS=$(echo "$SUBMIT_JSON" | jq -r '.status')

          # Always fetch Apple's detailed log — useful diagnostic even
          # for Accepted submissions; critical for Invalid ones.
          echo ""
          echo "=== notarytool log ($SUBMISSION_ID) ==="
          xcrun notarytool log "$SUBMISSION_ID" \
            --key    "$KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" || true

          rm -f "$KEY_PATH"

          if [ "$STATUS" != "Accepted" ]; then
            echo "ERROR: notarization status=$STATUS (see Apple log above)" >&2
            exit 1
          fi

      # Staple the notarization ticket ONLY if the submit step succeeded.
      # If staple fails when notarize succeeded, the pkg is still
      # technically notarized at Apple, but Gatekeeper would need to
      # network-check on every install — annoying but not blocking.
      - name: Staple notarization ticket
        if: steps.notarize.outcome == 'success'
        run: |
          set -eu
          PKG="build/pkg-out/Tracenium-Agent-${{ needs.resolve.outputs.version }}-arm64.pkg"
          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"

      # Always summarize the notarize outcome so the operator sees the
      # state in the run summary without reading the full job log.
      - name: Summarize notarize outcome
        run: |
          if [ "${{ steps.notarize.outcome }}" = "success" ]; then
            echo "::notice::macOS pkg fully notarized + stapled — installs without Gatekeeper warning"
          else
            echo "::warning::macOS notarize FAILED or timed out — shipping signed-only pkg as fallback"
            echo "::warning::This pkg installs silently via MDM (Jamf/Intune/Kandji)."
            echo "::warning::Direct-download installs will require ONE-time right-click → Open."
            echo "::warning::To notarize manually later (Mac with cert + ASC key):"
            echo "::warning::  xcrun notarytool submit <pkg> --key <p8> --key-id <id> --issuer <id> --wait"
            echo "::warning::  xcrun stapler staple <pkg>"
          fi

      # Strict mode: when the operator triggered the workflow with
      # `strict_notarize: true`, treat a failed notarize as a job
      # failure. Default is best-effort (silent fallback to signed-only).
      - name: Enforce strict notarize (when requested)
        if: inputs.strict_notarize == true && steps.notarize.outcome != 'success'
        run: |
          echo "ERROR: strict_notarize=true and notarization did not succeed" >&2
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: build/pkg-out/Tracenium-Agent-${{ needs.resolve.outputs.version }}-arm64.pkg
          retention-days: 14
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # windows-x64 — produces Tracenium-Agent-<v>-x64.msi (signed)
  # ──────────────────────────────────────────────────────────────────
  windows-x64:
    name: Build · Windows x64 (.msi)
    needs: resolve
    if: needs.resolve.outputs.build_mode == 'full'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.resolve.outputs.node_version }}
          architecture: x64
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX 6 + extensions
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.*
          # WiX 4+ removed the bundled extensions. `wix build -ext NAME`
          # ONLY references the extension by name — the binary must be
          # installed first via `wix extension add`.
          #
          # CRITICAL: pin extension versions to the WiX major. Without
          # the /6.0.0 pin, NuGet resolves to the latest (currently
          # 7.x), which only ships a `wixext7/` package root and is
          # rejected by wix v6 with:
          #   WIX6101: Could not find expected package root folder wixext6
          # The build then fails at extension-add (exit 1).
          #
          # `--global` installs to the user-wide extension store so any
          # subsequent `wix` invocation in the same job picks them up
          # regardless of cwd.
          wix extension add --global WixToolset.UI.wixext/6.0.0
          wix extension add --global WixToolset.Util.wixext/6.0.0
          wix --version
          wix extension list --global

      - name: Install repo dependencies (host)
        run: npm ci

      - name: Restore Windows x64 build cache
        uses: actions/cache@v4
        with:
          path: |
            build/.node-cache
          key: windows-x64-${{ needs.resolve.outputs.node_version }}

      # Cross-compile .NET binaries. The .sh runs fine on Windows via
      # Git Bash, which is preinstalled on windows-latest runners.
      - name: Build .NET binaries (PrivSvc + AgentTray)
        shell: bash
        run: ONLY_X64=1 ./scripts/build-windows-binaries.sh

      - name: Build AgentCore (x64 native — esbuild + node + better-sqlite3)
        shell: pwsh
        run: pwsh ./scripts/build-agentcore-windows.ps1 -Arch x64

      # ── Sign IN-PACKAGE binaries BEFORE MSI assembly ─────────────
      #
      # Each .exe / .node carries its own Authenticode signature and
      # builds its own reputation footprint in Defender's cloud.
      # Previously only the outer MSI was signed, leaving the .exes
      # (TraceniumAgentCore.exe, Tracenium.AgentTray.exe,
      # Tracenium.PrivSvc.Windows.exe) and better_sqlite3.node as
      # unsigned PE binaries on disk after install. That triggered:
      #   - Defender "Block at First Sight" on Tracenium.PrivSvc.Windows.exe
      #     during the 1.1.14→1.1.16 rollout (ETE-3X5P8F4 + TNS-OPER-SNOC04)
      #   - Empty "Verified Signer" column in Task Manager / Process
      #     Explorer (looks unprofessional, erodes operator trust)
      #   - No per-binary reputation gain for our Trusted Signing cert,
      #     making the "Windows protegió su PC" SmartScreen warning
      #     persist much longer than necessary.
      #
      # node.exe (Node 24 runtime) is EXCLUDED from our signing because
      # nodejs.org already signs it with the Node.js Foundation cert,
      # which has accumulated years of Defender reputation that
      # overwriting with our newer cert would forfeit. We move it
      # aside, sign everything else recursively, then move it back.
      - name: Stage node.exe out of signing scope (preserve nodejs.org cert)
        shell: pwsh
        run: |
          $node = "build\win-binaries\x64\AgentCore\node"
          if (Test-Path $node) {
            New-Item -ItemType Directory -Force -Path "build\_holdout" | Out-Null
            Move-Item $node "build\_holdout\node-x64" -Force
            Write-Host "→ staged node.exe to build\_holdout\node-x64 (will restore post-signing)"
          } else {
            Write-Host "  (no node.exe to stage — unexpected; signing will proceed)"
          }

      - name: Sign in-package binaries (.exe + .node)
        uses: azure/trusted-signing-action@v0.5.9
        with:
          azure-tenant-id:              ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:              ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret:          ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint:                     https://cus.codesigning.azure.net/
          trusted-signing-account-name: CertusWS-Signing
          certificate-profile-name:     safecertus-cp-public
          files-folder:                 ${{ github.workspace }}\build\win-binaries\x64
          files-folder-filter:          exe,node
          files-folder-recurse:         true
          file-digest:                  SHA256
          timestamp-rfc3161:            http://timestamp.acs.microsoft.com
          timestamp-digest:             SHA256

      - name: Restore node.exe into AgentCore tree
        # if: always() so we restore even if the signing step failed,
        # avoiding a workspace half-mutated for any post-fail debugging.
        if: always()
        shell: pwsh
        run: |
          $holdout = "build\_holdout\node-x64"
          if (Test-Path $holdout) {
            Move-Item $holdout "build\win-binaries\x64\AgentCore\node" -Force
            Write-Host "→ restored node.exe to AgentCore\node\"
          }

      - name: Build MSI
        shell: pwsh
        run: pwsh ./scripts/build-windows-msi.ps1 -Arch x64

      # ── Sign the outer MSI envelope ──
      # The MSI itself needs its own signature so SmartScreen recognizes
      # the installer at double-click time. The in-package binaries
      # signed above carry their signatures intact through the MSI's
      # CAB compression (Authenticode survives MSI packaging).
      - name: Sign MSI (Azure Trusted Signing)
        uses: azure/trusted-signing-action@v0.5.9
        with:
          azure-tenant-id:              ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:              ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret:          ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint:                     https://cus.codesigning.azure.net/
          trusted-signing-account-name: CertusWS-Signing
          certificate-profile-name:     safecertus-cp-public
          files-folder:                 ${{ github.workspace }}\build\win-msi\x64
          files-folder-filter:          msi
          file-digest:                  SHA256
          timestamp-rfc3161:            http://timestamp.acs.microsoft.com
          timestamp-digest:             SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/win-msi/x64/Tracenium-Agent-${{ needs.resolve.outputs.version }}-x64.msi
          retention-days: 14
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # windows-arm64 — produces Tracenium-Agent-<v>-arm64.msi (signed)
  #
  # CROSS-COMPILED FROM x64 host (windows-latest), NOT from an arm64
  # native runner. Reason: `windows-11-arm` + `azure/trusted-signing-
  # action` hit "SignTool failed with exit code 3" because the action
  # bundles signtool x64 which runs under emulation on the arm64 host
  # and has an internal error path with Authenticode + Trusted Signing
  # dlib. SignTool x64 on x64 host (this job) works fine — that's why
  # the windows-x64 job above succeeds.
  #
  # Cross-compile is safe because:
  #   - dotnet publish -r win-arm64 produces native arm64 PE binaries
  #     from any host (we already use this from macOS in
  #     build-windows-binaries.sh)
  #   - better-sqlite3 publishes prebuilt win32-arm64 .node bindings
  #     since v11.x. The PowerShell helper sets npm_config_arch=arm64
  #     so npm fetches the prebuild instead of trying to compile.
  #   - WinSW arm64 binary is committed to the repo (currently a copy
  #     of x64; runs via Windows ARM64 emulation, which is what the
  #     existing production MSIs already ship).
  # ──────────────────────────────────────────────────────────────────
  windows-arm64:
    name: Build · Windows arm64 (.msi)
    needs: resolve
    if: needs.resolve.outputs.build_mode == 'full'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.resolve.outputs.node_version }}
          # Host is x64; we cross-compile for arm64 inside the scripts.
          architecture: x64
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX 6 + extensions
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.*
          wix extension add --global WixToolset.UI.wixext/6.0.0
          wix extension add --global WixToolset.Util.wixext/6.0.0
          wix --version
          wix extension list --global

      - name: Install repo dependencies (host)
        run: npm ci

      - name: Restore Windows arm64 build cache
        uses: actions/cache@v4
        with:
          path: |
            build/.node-cache
          # Key includes 'crosscompile' so we don't accidentally share
          # a cache with a future native-arm64 run if we switch back.
          key: windows-arm64-crosscompile-${{ needs.resolve.outputs.node_version }}

      - name: Build .NET binaries for arm64 (cross-compile from x64)
        shell: bash
        run: ONLY_ARM64=1 ./scripts/build-windows-binaries.sh

      - name: Build AgentCore (arm64 — cross from x64, using npm prebuilds)
        shell: pwsh
        run: pwsh ./scripts/build-agentcore-windows.ps1 -Arch arm64

      # ── Sign in-package binaries — see x64 job for full rationale ──
      - name: Stage node.exe out of signing scope (preserve nodejs.org cert)
        shell: pwsh
        run: |
          $node = "build\win-binaries\arm64\AgentCore\node"
          if (Test-Path $node) {
            New-Item -ItemType Directory -Force -Path "build\_holdout" | Out-Null
            Move-Item $node "build\_holdout\node-arm64" -Force
            Write-Host "→ staged node.exe to build\_holdout\node-arm64 (will restore post-signing)"
          } else {
            Write-Host "  (no node.exe to stage — unexpected; signing will proceed)"
          }

      - name: Sign in-package binaries (.exe + .node)
        uses: azure/trusted-signing-action@v0.5.9
        with:
          azure-tenant-id:              ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:              ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret:          ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint:                     https://cus.codesigning.azure.net/
          trusted-signing-account-name: CertusWS-Signing
          certificate-profile-name:     safecertus-cp-public
          files-folder:                 ${{ github.workspace }}\build\win-binaries\arm64
          files-folder-filter:          exe,node
          files-folder-recurse:         true
          file-digest:                  SHA256
          timestamp-rfc3161:            http://timestamp.acs.microsoft.com
          timestamp-digest:             SHA256

      - name: Restore node.exe into AgentCore tree
        if: always()
        shell: pwsh
        run: |
          $holdout = "build\_holdout\node-arm64"
          if (Test-Path $holdout) {
            Move-Item $holdout "build\win-binaries\arm64\AgentCore\node" -Force
            Write-Host "→ restored node.exe to AgentCore\node\"
          }

      - name: Build MSI
        shell: pwsh
        run: pwsh ./scripts/build-windows-msi.ps1 -Arch arm64

      - name: Sign MSI (Azure Trusted Signing)
        uses: azure/trusted-signing-action@v0.5.9
        with:
          azure-tenant-id:              ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:              ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret:          ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint:                     https://cus.codesigning.azure.net/
          trusted-signing-account-name: CertusWS-Signing
          certificate-profile-name:     safecertus-cp-public
          files-folder:                 ${{ github.workspace }}\build\win-msi\arm64
          files-folder-filter:          msi
          file-digest:                  SHA256
          timestamp-rfc3161:            http://timestamp.acs.microsoft.com
          timestamp-digest:             SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: build/win-msi/arm64/Tracenium-Agent-${{ needs.resolve.outputs.version }}-arm64.msi
          retention-days: 14
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # publish — download all 5 artifacts and upload to Azure Blob.
  #
  # Gated to `main` only — Package-Prepare runs produce SIGNED artifacts
  # downloadable from the Actions run (for validation install), but
  # never touch the blob storage. Merge to `main` is the explicit
  # promote-to-prod gesture.
  #
  # Also: needs every build job to succeed. If anyone fails, the
  # release stays at the previous version — no partial publishes.
  # ──────────────────────────────────────────────────────────────────
  publish:
    name: Publish to Azure Blob
    # Run only on main. The condition is wider than just `ref == main`
    # because we need to handle the case where the 4 build jobs were
    # SKIPPED (build_mode=promote) — by default GitHub Actions would
    # skip downstream jobs in that case. `always()` makes us evaluate
    # regardless, and we explicitly check the dependency outcomes:
    #   - resolve MUST have succeeded (always required)
    #   - build jobs must be EITHER success (full mode) OR skipped
    #     (promote mode). Failure of any build job aborts publish.
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.resolve.result == 'success' &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.windows-x64.result == 'success' || needs.windows-x64.result == 'skipped') &&
      (needs.windows-arm64.result == 'success' || needs.windows-arm64.result == 'skipped')
    needs: [resolve, linux, macos, windows-x64, windows-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Download artifacts from the CORRECT run:
      #   - build_mode=full:    this current run produced the artifacts
      #     (run-id defaults to github.run_id)
      #   - build_mode=promote: a Package-Prepare run produced them
      #     (run-id = needs.resolve.outputs.source_run_id)
      # `github-token` is required when run-id is from a DIFFERENT run.
      - name: Show release source
        run: |
          if [ "${{ needs.resolve.outputs.build_mode }}" = "promote" ]; then
            echo "::notice::Promoting artifacts from Package-Prepare run ${{ needs.resolve.outputs.source_run_id }}"
          else
            echo "::notice::Using artifacts built in this run (build_mode=full)"
          fi

      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.resolve.outputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: dl

      # Re-stage downloaded artifacts into the layout publish-binaries.sh
      # expects. Each upload-artifact above named the directory by job,
      # so dl/{linux-x64,macos-arm64,windows-x64,windows-arm64} hold the
      # respective files at their root.
      - name: Stage artifacts into build/ layout
        run: |
          set -eu
          V=${{ needs.resolve.outputs.version }}

          mkdir -p build/pkg-out
          mkdir -p build/linux/pkg-out
          mkdir -p build/win-msi/x64
          mkdir -p build/win-msi/arm64

          cp "dl/macos-arm64/Tracenium-Agent-$V-arm64.pkg"     build/pkg-out/
          cp "dl/linux-x64/Tracenium-Agent-$V-x64.deb"         build/linux/pkg-out/
          cp "dl/linux-x64/Tracenium-Agent-$V-x64.rpm"         build/linux/pkg-out/
          cp "dl/windows-x64/Tracenium-Agent-$V-x64.msi"       build/win-msi/x64/
          cp "dl/windows-arm64/Tracenium-Agent-$V-arm64.msi"   build/win-msi/arm64/

          echo "=== staged artifacts ==="
          find build/pkg-out build/linux/pkg-out build/win-msi -type f -exec ls -lh {} \;

      # `az login` with `--allow-no-subscriptions` succeeds even when
      # the SP has no subscription-level role (which is our case — the
      # SP only holds Trusted Signing Signer + Storage Blob Data
      # Contributor at the storage-account scope). Without that flag,
      # `az login --service-principal` errors out with "No subscriptions
      # found for ***" before any of our subsequent commands can run,
      # because azure-cli's default behavior is to enumerate
      # subscriptions immediately after auth. With the flag, auth
      # succeeds and we pin the working subscription via `az account
      # set` so all subsequent commands (storage upload, etc.) target
      # the right tenant.
      #
      # See repo-level secret AZURE_SUBSCRIPTION_ID for value origin.
      - name: Azure login (service principal)
        env:
          AZURE_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "ERROR: AZURE_SUBSCRIPTION_ID secret is missing." >&2
            echo "       Set it in repo Settings → Secrets and variables → Actions." >&2
            echo "       Value: the UUID of the subscription that owns cwsinveid." >&2
            exit 1
          fi

          az login --service-principal \
            --tenant   "$AZURE_TENANT_ID" \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --allow-no-subscriptions \
            --output none

          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az account show --output table

      - name: Publish all 5 artifacts to blob storage
        env:
          # publish-binaries.sh defaults to --auth-mode key (looks for a
          # storage account key). In CI we use --auth-mode login so the
          # OIDC-authenticated service principal's RBAC role
          # (Storage Blob Data Contributor) is what authorizes uploads.
          # No storage account keys in secrets.
          TRACENIUM_AZ_AUTH_MODE: login
          TRACENIUM_AGENT_VERSION: ${{ needs.resolve.outputs.version }}
        run: ./scripts/publish-binaries.sh

      - name: Print summary
        run: |
          V=${{ needs.resolve.outputs.version }}
          echo "## Release $V published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Verify backend metadata:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for p in "macos:arm64" "windows:arm64" "windows:x64" "linux:x64"; do
            platform="${p%:*}"
            arch="${p#*:}"
            echo "curl -sS 'https://api.tracenium.com/api/v1/binaries/agent/metadata?platform=$platform&arch=$arch' | jq ." >> $GITHUB_STEP_SUMMARY
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
