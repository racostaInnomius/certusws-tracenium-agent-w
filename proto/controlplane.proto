syntax = "proto3";

package tracenium.control;

service ControlPlane {
  rpc Connect(stream ControlMessage) returns (stream ControlMessage);
}

// ---------------- ACK ----------------

enum AckStatus {
  ACK_OK = 0;
  ACK_RETRY = 1;
  ACK_REJECTED = 2;
}

message Ack {
  string eventId = 1;
  AckStatus status = 2;
  string message = 3;
  string receivedAtUtc = 4;
  string serverTimeUtc = 5;
}

message Error {
  string code = 1;
  string message = 2;
}

// ---------------- AGENT -> SERVER ----------------

message Hello {
  string eventId = 1;

  string deviceId = 2;
  string tenantId = 3;
  string agentVersion = 4;
  string protocolVersion = 5;
  string policyVersion = 6;

  repeated string capabilities = 7;
}


message Facts {
  string eventId = 1;
  bytes payloadJson = 2;
  string deviceId = 3;
  string namespace = 4;
  repeated string namespaces = 5;
}

message Heartbeat {
  string eventId = 1;
  string deviceId = 2;
  int64 uptimeSeconds = 3;

  // useful for detecting version/policy drift
  string agentVersion = 4;
  string policyVersion = 5;
}

// ---------------- SERVER -> AGENT ----------------

message RunJob {
  string jobId = 1;
  string jobType = 2;
  bytes payloadJson = 3;
}

message RotateCert {
  string reason = 1;
}

message PolicyUpdate {
  string eventId = 1;
  string policyVersion = 2;
  bytes policyJson = 3;
}

message Disconnect {
  string reason = 1;
}

message AgentUpdate {
  string jobId = 1;
  string version = 2;
}

// ---------------- REMOTE CONTROL (RCP) SIGNALING ----------------
//
// WebRTC signaling messages for the RCP family (rcp.shell first, then
// rcp.file in M2, rcp.screen in M3). The actual I/O — keystrokes,
// output, file chunks, screen frames — flows over a WebRTC peer
// connection established directly between the operator's browser and
// this agent. The backend mediates only:
//   1. Authorization (admin_master gate on session start)
//   2. Signaling relay (SDP offer/answer + ICE candidates)
//   3. Lifecycle audit + transcript upload (in M1.S3)
//
// All signaling messages carry sessionId — multiple concurrent
// sessions can be in flight on the same gRPC stream. See
// RCP_DESIGN_DECISIONS_v2.md for the full architecture.

// Backend → Agent. The browser created an SDP offer (acting as
// offerer); the backend forwards it after verifying the operator's
// admin_master role and that this device belongs to the operator's
// tenant. Agent's job: create a PeerConnection, set remote
// description, generate an answer, reply with RemoteSessionAnswer.
message RemoteSessionOffer {
  string sessionId = 1;
  string sdp = 2;
  // Capability the session is requesting. Agent rejects via
  // RemoteSessionError if it doesn't advertise this capability
  // (e.g. rcp.shell when policy.features.remoteShell is false).
  string capability = 3;
  // Hard cap so the agent can pre-allocate / refuse to spawn.
  int32 sessionTimeoutSeconds = 4;
  // ICE servers (STUN + TURN, Cloudflare-minted per session). Backend
  // forwards the SAME creds it gave the operator's browser so the
  // agent's PeerConnection emits relay candidates of its own — without
  // this the agent is unreachable from any browser when it sits behind
  // a NAT (every corporate desktop, every cloud VM, every VirtualBox
  // guest). JSON-encoded for forward-compat; agent does JSON.parse and
  // feeds the array to `new PeerConnection({ iceServers })`.
  //
  // ⚠️ This proto file MUST stay in sync with
  // ../certusws-tracenium/proto/controlplane.proto. The PrivSvc C#
  // service generates its classes from THIS copy at build time, AND
  // the AgentCore loads its descriptor from THIS copy at runtime via
  // @grpc/proto-loader. The backend gRPC server uses its OWN copy.
  // Drift = silently-dropped fields at the C# boundary; exactly what
  // happened 2026-06-10 before this commit landed (backend proto had
  // the field, agent-w proto didn't, PrivSvc never knew the field
  // existed, AgentCore got iceServersCount: 0 on every offer).
  string iceServersJson = 5;
}

// Agent → Backend. The agent's SDP answer in response to a
// RemoteSessionOffer. Backend forwards to the operator's browser
// over the WebSocket signaling channel.
message RemoteSessionAnswer {
  string sessionId = 1;
  string sdp = 2;
}

// Bidirectional. ICE candidates discovered by either side after the
// initial offer/answer. The candidate string is the standard SDP
// "candidate:" line; sdpMid and sdpMLineIndex identify which media
// section it belongs to (matters once we add video tracks in M3).
message RemoteSessionIce {
  string sessionId = 1;
  string candidate = 2;
  string sdpMid = 3;
  int32 sdpMLineIndex = 4;
}

// Bidirectional. Tear-down marker. The agent sends it when the
// shell exits or an idle timeout fires; the backend sends it when
// the operator's browser disconnects past the grace window. After
// either side sends close, the receiver should release the
// PeerConnection and audit the session as ended.
message RemoteSessionClose {
  string sessionId = 1;
  // Free-form. Audit log shows this on the closed session row.
  // Conventional values: "user_closed", "operator_disconnected",
  // "idle_timeout", "hard_cap_timeout", "agent_error",
  // "policy_denied", "capability_unavailable".
  string reason = 2;
}

// Bidirectional. Surfaces a structured error before close. Use cases:
//   - agent rejects capability (policy off, no PTY available)
//   - SDP parse failure
//   - ICE failed to establish within window
// Backend persists into remote_session_events for audit.
message RemoteSessionError {
  string sessionId = 1;
  string code = 2;
  string message = 3;
}

// Agent → Backend (M1.S3). Append-only chunk of session output.
// Flushed every ~5s or when the buffer reaches ~8KB, whichever
// triggers first. Backend persists into remote_session_io and uses
// it as a liveness signal (idle-timeout sweep treats sessions with
// recent transcript activity as alive).
//
// Stream is a string instead of an enum so a future opt-in stdin
// recording lands without a proto bump; values are 'stdout' or
// 'stdin'. M1 ships stdout only.
message RemoteSessionTranscript {
  string sessionId = 1;
  string stream = 2;
  // Offset from the session's started_at, in seconds (fractional).
  // Matches asciinema v2's "time" field exactly so replay can
  // serialize the chunks back to the standard format with no
  // recomputation.
  double tsDeltaSeconds = 3;
  // UTF-8. May contain ANSI escapes; replay renders them via
  // xterm.js. Capped at 64 KB per chunk by the agent.
  string data = 4;
  // Convenience for backend aggregates without measuring UTF-8
  // bytes on every chunk. Set by the agent at flush time.
  int32 bytesCount = 5;
}

// Agent → Backend (M2.S1). Audit event for a file transfer over
// WebRTC DataChannel (rcp.file sessions). The actual file bytes
// flow P2P over the DataChannel; the backend never touches them —
// this message is purely an audit hook so the backend can persist
// who transferred what and whether it succeeded.
//
// The agent fires one event at 'started' and one at the terminal
// status ('completed' | 'failed' | 'cancelled'). The backend
// UPSERTs on transfer_id so both events land in the same audit row.
//
// direction: "download" = agent→browser; "upload" = browser→agent.
message RemoteFileTransferAudit {
  string sessionId        = 1;
  // Agent-minted UUID, stable across the transfer lifecycle.
  string transferId       = 2;
  // "download" | "upload"
  string direction        = 3;
  // Full POSIX/Win32 path on the device.
  string remotePath       = 4;
  // basename(remotePath). Convenience field.
  string filename         = 5;
  // Total bytes of the file. 0 if not yet known at 'started'.
  int64  sizeBytes        = 6;
  // Bytes actually transferred at the time of this event.
  int64  transferredBytes = 7;
  // "started" | "completed" | "failed" | "cancelled"
  string status           = 8;
  // Set on 'failed'. Empty otherwise.
  string errorMessage     = 9;
}

// Agent → Backend (M3.S1). Lifecycle audit for a screen share
// session over WebRTC DataChannel (rcp.screen sessions). The
// actual frame bytes flow P2P over the DataChannel; the backend
// only records session-level events.
//
// The agent fires "started" when the DataChannel opens and
// "stopped" or "error" when it closes.
message RemoteScreenAudit {
  string sessionId    = 1;
  // "started" | "stopped" | "error"
  string event        = 2;
  // Screen resolution the agent is streaming at.
  int32  width        = 3;
  int32  height       = 4;
  // Target frames per second agreed at negotiation time.
  int32  fps          = 5;
  // Set on "error". Empty otherwise.
  string errorMessage = 6;
}

// ---------------- SOFTWARE CATALOG (self-service) ----------------
//
// Every other job dispatch in this system is admin-push (see RunJob) —
// an operator picks devices in the web UI and the backend fans out.
// This pair of message types is the one deliberate exception: the
// device itself asks "what can I self-install" and "please install
// this", driving the macOS tray's "Software Catalog" tab. To keep the
// blast radius of that exception small, the backend only ever returns
// / accepts packages an admin explicitly flagged
// software_packages.self_service_enabled = true (see
// modules/software-delivery). Once a SelfInstallRequest is accepted,
// the install itself still flows down as an ordinary
// RunJob{jobType:"software_install"} on the SAME connection — these
// messages exist only to negotiate catalog + consent, not to carry
// the install.

// Agent -> Server. Device asks for its tenant's self-service catalog,
// filtered server-side to items compatible with this device's
// platform/arch (see modules/software-delivery for the compatibility
// rule already used by admin dispatch's per-device evaluation).
message CatalogRequest {
  string eventId = 1;
}

message SoftwareCatalogItem {
  string packageId = 1;
  string name = 2;
  string vendor = 3;
  string version = 4;
  string description = 5;
  bool requiresReboot = 6;
}

// Server -> Agent.
message CatalogResponse {
  string eventId = 1;
  // Hash of the filtered result set. The agent stores this and
  // compares next time, so a tray-status write only fires when the
  // eligible catalog actually changed — same "compute → compare →
  // only push/write if different" shape as PolicyUpdate/policyVersion.
  string catalogVersion = 2;
  repeated SoftwareCatalogItem items = 3;
}

// Agent -> Server. The end user clicked "Install" on one catalog item
// in the tray. packageId MUST be one the most recent CatalogResponse
// offered — the backend re-validates self_service_enabled + platform/
// arch fit server-side regardless (never trust the client's filtering).
message SelfInstallRequest {
  string eventId = 1;
  string packageId = 2;
}

// Server -> Agent.
message SelfInstallAck {
  string eventId = 1;
  bool accepted = 2;
  // Set when accepted — the jobId of the RunJob{software_install} the
  // backend just dispatched (or will dispatch momentarily) on this
  // same device/connection. Empty when accepted = false.
  string jobId = 3;
  // Set when accepted = false, e.g. "not_self_service", "platform_mismatch",
  // "package_not_found", "job_already_running".
  string errorCode = 4;
  string errorMessage = 5;
}

// ---------------- CONTROL PLANE MESSAGE ----------------

message ControlMessage {
  string traceId = 10;

  oneof msg {

    // agent -> server
    Hello hello = 1;
    Facts facts = 2;
    Heartbeat heartbeat = 3;

    // server -> agent
    RunJob runJob = 4;
    RotateCert rotateCert = 5;
    PolicyUpdate policyUpdate = 6;
    Disconnect disconnect = 7;
    AgentUpdate agentUpdate = 8;

    // bidirectional
    Ack ack = 11;
    Error error = 12;

    // RCP signaling (Sprint 1 of M1). See RemoteSession* message
    // docs above. Field numbers 20-29 reserved for the RCP family
    // to leave room for future signaling variants without
    // colliding with existing oneof tags.
    RemoteSessionOffer remoteSessionOffer   = 20;  // server -> agent
    RemoteSessionAnswer remoteSessionAnswer = 21;  // agent -> server
    RemoteSessionIce remoteSessionIce       = 22;  // bidirectional
    RemoteSessionClose remoteSessionClose   = 23;  // bidirectional
    RemoteSessionError remoteSessionError   = 24;  // bidirectional
    RemoteSessionTranscript remoteSessionTranscript = 25; // agent -> server (M1.S3)
    RemoteFileTransferAudit remoteFileTransferAudit  = 26; // agent -> server (M2.S1)
    RemoteScreenAudit       remoteScreenAudit        = 27; // agent -> server (M3.S1)

    // Software Catalog self-service (see message docs above).
    // Field numbers 30-33 — next free block after RCP's 20-29.
    CatalogRequest catalogRequest         = 30; // agent -> server
    CatalogResponse catalogResponse       = 31; // server -> agent
    SelfInstallRequest selfInstallRequest = 32; // agent -> server
    SelfInstallAck selfInstallAck         = 33; // server -> agent
  }
}
